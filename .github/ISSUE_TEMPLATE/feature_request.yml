name: Feature Request
description: Suggest a new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      placeholder: Describe the feature you'd like
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      placeholder: Why do you need this feature?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Any alternative solutions?
