name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./app/...

      - name: Build CLI
        run: go build -o oiwest-core ./app/cmd/cli

      - name: Build Daemon
        run: go build -o oiwest-daemon ./app/cmd/daemon

      - name: Test
        run: go test ./app/... -v -count=1

  build-cross:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: 386
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w" -o oiwest-core${{ matrix.goos == 'windows' && '.exe' || '' }} ./app/cmd/cli
          go build -ldflags="-s -w" -o oiwest-daemon${{ matrix.goos == 'windows' && '.exe' || '' }} ./app/cmd/daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oiwest-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            oiwest-core*
            oiwest-daemon*
